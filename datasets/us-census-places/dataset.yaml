  - The display package cb2023-display-r3 passed its checks on loopback only. Its first build, r1,
    failed three checks and is kept as failed evidence.
  source_coop:
    owner: nthh
    owner_status: confirmed
    account_verification:
      status: confirmed
      owner: nthh
      evidence_path: research/source-publication-20261106/account-verification.json
      evidence_sha256: 5515f007abc95b38131ac42d95f358a07d4b6f8d950e38d1a202916635460cdc
    product_id: us-census-places
    title: US Census counties, places and county subdivisions, 2023 cartographic boundaries
    summary: Shore-clipped outlines of US counties, cities and other places, and county subdivisions,
      from the Census Bureau's 2023 cartographic boundary files, as GeoParquet with government status
      and 2023 population estimates added, and a display package of outline tiles and a names index
      for choosing places on a map.
    tags:
    - census
    - boundaries
    - counties
    - places
    - united-states
    - geoparquet
    - pmtiles
    license_note: US Government work in the public domain. The Census Bureau asks to be cited as the
      source. These files are a format conversion, not a Census Bureau product.
    attribution: 'Source: US Census Bureau, 2023 cartographic boundary files, gazetteer files and vintage
      2023 population estimates.'
    temporal_note: Boundaries as of 1 January 2023. Population estimates are for 1 July 2023.
    limitations:
    - Generalised boundaries for mapping at 1:500,000, not legal boundaries. The TIGER/Line files are
      the fuller source.
    - Census designated places, Puerto Rico and the island areas carry no population estimate.
    - Coordinates are NAD83 (EPSG:4269) and are not transformed.
    - The display tiles draw only county subdivisions that are active governments; all of them are in
      the GeoParquet.
    supplements: []
related_datasets:
- id: cboettig-census-2024
  title: Census TIGER/Line 2024 counties and places (cboettig/census)
  relationship: alternative
  url: https://source.coop/cboettig/census
  use_case: National counties and places as GeoParquet and PMTiles, from the full-resolution TIGER/Line files.
  comparison: Counties and places only, no county subdivisions. TIGER/Line 2024 geometry, which runs
    out into coastal water, where the cartographic boundary files used here are clipped to the shore
    and generalised. Its tiles carry NAME, GEOID and FUNCSTAT but no bounds, state abbreviation,
    population or label points. On 2026-11-16 its tiles read 89 to 359 KB for three whole-state
    views and 36 to 91 KB for three whole-county views, within the limits of display-plan.md.
  spatial_coverage: 50 states, DC, Puerto Rico and the island areas
  formats: [GeoParquet, PMTiles]
  access: Tile headers, layer fields and six map views were read anonymously on 2026-11-16. The
    GeoParquet files were listed, not opened.
  reviewed_on: '2026-11-16'
  evidence:
  - title: Product page
    url: https://source.coop/cboettig/census
- id: seerai-hifld
  title: HIFLD archive with Census TIGER 2024 counties, places and county subdivisions (seerai/hifld)
  relationship: alternative
  url: https://source.coop/seerai/hifld
  use_case: The same three layers, with tracts and block groups, as GeoParquet.
  comparison: Holds all three layers, with incorporated places and census designated places as two
    datasets, from the TIGER 2024 geodatabase. GeoParquet only, as directories of part files; no
    tiles. Its READMEs were read; no data file was opened, so schema and row counts are unchecked.
  formats: [GeoParquet]
  access: Listed anonymously and READMEs read on 2026-11-16; data files not opened.
  reviewed_on: '2026-11-16'
  evidence:
  - title: Product page
    url: https://source.coop/seerai/hifld
