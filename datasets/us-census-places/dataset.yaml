  release: cb2023-r1
  manifest_path: datasets/us-census-places/releases/cb2023-r1/manifest.json
  manifest_sha256: 50ac55e92fa5277d9e4ce12c0a6c180ed529e6e7f0a6df96b42299986bfc045a
  validation_path: datasets/us-census-places/releases/cb2023-r1/source-fidelity.json
  release_receipt_path: datasets/us-census-places/releases/cb2023-r1/package-receipt.json
  conversion_git_commit: 5464a777f6be8f1530a5bbbd3060080d070b4ac1
  local_bundle_directory: .local/us-census-places/package/cb2023-r1
  catalog:
    snapshot_path: datasets/us-census-places/releases/cb2023-r1/catalog-input-r1/snapshot.json
    snapshot_sha256: 38ce6bb615e7cf4a558205d6e8288fa2c888a3736ebfe6cd43ef1014943e75d4
    package_base_url: null
