schema_version: 1
id: naip
title: NAIP display copies, 2024 onward
intake:
  kind: producer
  reference_url: https://registry.opendata.aws/naip/
  added_on: '2026-11-10'
triage:
  decision: publish_conversion
  priority: pilot_review
  rationale: The public RGB display copy of NAIP (s3://naip-visualization) stops at 2023. The 2024 and
    2025 flights exist on AWS only as requester-pays MRF in s3://naip-analytic. Utah 2024 was converted
    on 2026-11-10 as a pilot (6,032 quarter quads) and a 20-quad control against the published 2021
    display copy matched its pixels. Nothing is published yet.
publication:
  status: candidate
  source_coop:
    owner: nthh
    owner_status: confirmed
    account_verification: null
    product_id: naip
    title: NAIP display copies, 2024 onward
    summary: RGB JPEG Cloud-Optimized GeoTIFFs of USDA NAIP quarter quads for the state-years that the
      AWS naip-visualization bucket does not hold, converted from the naip-analytic MRF files with the
      same settings, file names and key layout.
    tags:
    - naip
    - aerial-imagery
    - usda
    - united-states
    - cog
    license_note: NAIP imagery is produced by the USDA Farm Production and Conservation Business Center
      and is in the public domain. USDA asks for credit; these files are a format conversion, not a USDA
      product.
    attribution: USDA Farm Production and Conservation Business Center, Geospatial Enterprise Operations
      (NAIP). Source files from the NAIP on AWS open data buckets maintained by Esri.
    temporal_note: One file per quarter quad per state-year. Each file name ends in the date it was
      flown. Utah 2024 was flown from 2024-06-23 to 2024-08-31.
    limitations:
    - Display copy only. The files hold red, green and blue as lossy JPEG at quality 85. The
      near-infrared band and the lossless pixels stay in s3://naip-analytic.
    - Only Utah 2024 is converted so far, and it sits in a private bucket. It is not on Source Cooperative.
    - Files converted in the Utah pilot have no recorded SHA-256; the converter records one from the next run on.
    - Adjacent quarter quads overlap, as they do in the source.
    supplements: []
source:
  producer: USDA Farm Production and Conservation Business Center
  bucket: s3://naip-analytic (us-west-2, requester pays)
  layout: <state>/<year>/<resolution>/rgbir/<block>/<name>.mrf with .idx and .lrc beside it
  format: Esri MRF with LERC, four 8-bit bands (red, green, blue, near infrared)
  inventory:
    listed_on: '2026-11-10'
    path: datasets/naip/evidence/naip-analytic-2024-2025-sizes.json
    state_years: 52
    quads: 221255
    lrc_bytes: 180106491705482
    note: Sizes are the .lrc data files; the evidence file has the per-state figures. One Idaho 2025
      quad (m_4311118_ne_12_030_20250717) has a header and index but no data file and is left out.
build:
  converter: datasets/naip/worker/convert.py
  container: ghcr.io/osgeo/gdal:ubuntu-small-3.13.1 plus boto3
  settings: 'COG driver, bands 1 to 3, COMPRESS=JPEG, QUALITY=85, BLOCKSIZE=512, OVERVIEW_RESAMPLING=AVERAGE'
  output_layout: <state>/<year>/<resolution>/rgb/<block>/<name>.tif
  validation: datasets/naip/VALIDATION.md
  converted:
  - state_year: ut-2024-60cm
    run: ut2024-1
    converted_on: '2026-11-10'
    files: 6032
    bytes: 249594785306
    summary: datasets/naip/evidence/utah-2024-summary.json
    index: datasets/naip/evidence/utah-2024-index.json
    location: private work bucket in us-west-2; not published
