    product_id: naip
    title: NAIP visualization COGs
    summary: RGB JPEG Cloud-Optimized GeoTIFFs of USDA NAIP quarter quads, converted from the
      naip-analytic MRF files with the settings, file names and key layout of the AWS
      naip-visualization bucket. Every 2024 and 2025 state-year, which that bucket does not hold, and
      the latest flight of the four states last flown in 2023, with reduced pictures of each state
      and of the country for drawing a map.
    file_layout:
    - 'Quarter quads: `<state>/<year>/<resolution>/rgb/<block>/<name>.tif`, as in the AWS naip-visualization
      bucket, for example `ut/2024/60cm/rgb/40111/m_4011127_ne_12_060_20240816.tif`.'
    - 'Overview files: `overviews/<state>-<year>-utm<zone>.tif` (one flight year of one state in one UTM zone,
      9.6 m) and `overviews/national-latest.tif` (the latest flight of each state, EPSG:3857, about 306 m).'
    - 'Indexes: `stac/naip.parquet` lists every quarter quad and `stac/naip-overviews.parquet` every overview
      file, as STAC GeoParquet: address, size, SHA-256, footprint, CRS and flight date. A reader finds the
      files for a place by querying the index on its `bbox` columns. `stac/naip.gti.fgb` opens the newest
      flight of every place in QGIS or GDAL as one mosaic (GDAL tile index in FlatGeobuf), with
      `stac/naip-overviews.gti.fgb` for zoomed-out views.'
    readme_sections:
    - heading: How the two indexes are organized
      body: |-
        Each index is a single GeoParquet file in the STAC GeoParquet layout: one row per STAC Item, with
        the file's address in the `image` asset. There are no Item JSON files and no partitions. The
        STAC Collection is stored in the file's own metadata under the `stac-geoparquet` key, and the
        GeoParquet metadata under `geo`.

        `stac/naip.parquet` has 245,554 rows, one per quarter quad file, covering 213,436 places; a place
        flown in more than one listed year has a row for each. Its columns:

        - `id`: state and file name, for example `ut_m_4011127_ne_12_060_20240816`.
        - `geometry`: the footprint polygon, WKB in longitude and latitude; `bbox`: its extent as
          `xmin`, `ymin`, `xmax`, `ymax`.
        - `datetime`: the flight date, at 00:00 UTC.
        - `gsd` (0.3 or 0.6 m), `naip:state`, `naip:year`.
        - `proj:code`, `proj:epsg`, `proj:bbox`, `proj:shape`, `proj:transform`: the file's UTM grid.
        - `assets.image`: `href` (the file's address), `file:size`, `file:checksum` (SHA-256 as a
          multihash), `type` and `roles`.
        - `naip:run`: the conversion run that made the file.
        - `naip:gti_location`: the file's address relative to `stac/`, for example
          `../ut/2024/60cm/rgb/40111/m_4011127_ne_12_060_20240816.tif`. It is not a STAC field; use
          `href` instead.

        `stac/naip-overviews.parquet` has 115 rows, one per overview file, with the same columns except
        `naip:run`, plus `start_datetime` and `end_datetime` (the flights drawn into the file) and
        `naip:quads` (how many quarter quads it was made from). The national file's row has no state
        or year.

        Rows of the quad index are ordered along a Hilbert curve through the centre of each footprint,
        newest flight first at the same place, with states and years mixed. They are written in 30
        row groups of about 8,192 rows, with statistics and a page index, so a query for a small area
        reads a few row groups instead of the whole 45 MB file. For the newest picture of a place, keep
        the row with the latest `datetime`.

        The quarter quads around Alta, Utah, newest first:

        ```sql
        SELECT id, datetime, assets.image.href AS href
        FROM read_parquet('https://data.source.coop/nthh/naip/stac/naip.parquet')
        WHERE bbox.xmin < -111.60 AND bbox.xmax > -111.65
          AND bbox.ymin < 40.60 AND bbox.ymax > 40.58
        ORDER BY datetime DESC;
        ```
    - heading: Open in QGIS or GDAL
      body: |-
        `stac/naip.gti.fgb` opens the newest flight of every place as one mosaic in QGIS (Layer > Add
        Layer > Add Raster Layer, with this address as the source) and in GDAL 3.9 or later:

        ```
        GTI:/vsicurl/https://data.source.coop/nthh/naip/stac/naip.gti.fgb
        ```

        For example `gdal_translate -projwin -111.66 40.60 -111.60 40.57 GTI:/vsicurl/https://data.source.coop/nthh/naip/stac/naip.gti.fgb alta.tif`.
        The `GTI:` prefix tells GDAL the FlatGeobuf file is a tile index; keep it. The file is a GDAL
        tile index (GTI): one row per 3.75-minute cell of the quarter-quad grid, holding the newest
        quarter quad there, with the cell as its footprint, and the mosaic's settings in the
        FlatGeobuf layer metadata. Because no two footprints overlap, GDAL reads the files of a view at
        the same time instead of one after another. The mosaic is in NAD83 longitude and latitude at
        about 0.5 m, with an alpha band so the masked edge of each quad stays clear. Zoomed out it draws
        the 9.6 m state files and then the national file, through `stac/naip-overviews.gti.fgb`. Each
        file's address in the index is absolute and tells GDAL not to look for side files, so opening
        it needs no other setting and no Parquet driver. GDAL reads only the part of the 70 MB index in
        view: in one test session at Alta, Utah, opening took 0.4 s and a first 1 m view 2.3 s, with
        22 file reads.

        Each quarter quad covers a little more than its cell, and GDAL draws all of it, so where two
        neighbours overlap either may be on top. Where the newest file of a cell has no picture, the
        mosaic is empty rather than showing an older flight.
    tags:
    - naip
    - aerial-imagery
    - usda
    - united-states
    - cog
    license_note: NAIP imagery is produced by the USDA Farm Production and Conservation Business Center
      and is in the public domain. USDA asks for credit; these files are a format conversion, not a USDA
      product.
    attribution: USDA Farm Production and Conservation Business Center, Geospatial Enterprise Operations
      (NAIP). Source files from the NAIP on AWS open data buckets maintained by Esri.
    temporal_note: One file per quarter quad per state-year, from flights of 2021 to 2025. Each file
      name holds the date it was flown; a 2023 name then holds a second date, the day the file was
      made. The quad index gives the flight date of every file.
    limitations:
    - Display copy only. The files hold red, green and blue as lossy JPEG at quality 65, with
      overviews at quality 75 and colour at half resolution. The near-infrared band and the
      lossless pixels stay in s3://naip-analytic.
    - Four Pennsylvania 2024 files carry a 2010 flight date in their names, as they do in the source.
    - Pennsylvania 2024 (1,118 quads) and West Virginia 2024 (101 quads) cover only part of each
      state. Their files are hosted, under pa/2024/ and wv/2024/ and as overviews/pa-2024-utm18.tif
      and overviews/wv-2024-utm17.tif, but the two indexes do not list them and the national file
      is made without them. Both states are listed whole from 2022, so a map that draws the newest
      file over a place shows one flight per state. The rule is a count. A year holding under 90%
      of the quads of an older year of the same state is not listed.
    - The 2024 folders of the source lack every quad numbered xx12023 (California and Oregon at
      120 W), and Florida 2025 lacks a strip of south Florida. Those places are filled with only the
      missing quads from California 2022, Oregon 2022 and Florida 2023. They differ from their
      neighbours in year, season and tone.
    - The overview files are for drawing a map, not for measurement. A state file holds one flight
      year of one state in one UTM zone at 9.6 m; the national file holds the latest flight of each
      state, so neighbouring states can differ in year and in tone.
    - Adjacent quarter quads overlap, as they do in the source.
    supplements: []
source:
  producer: USDA Farm Production and Conservation Business Center
  bucket: s3://naip-analytic (us-west-2, requester pays)
  layout: <state>/<year>/<resolution>/rgbir/<block>/<name>.mrf with .idx and .lrc beside it
  format: Esri MRF with LERC, four 8-bit bands (red, green, blue, near infrared)
  inventory:
    listed_on: '2026-11-10'
    path: datasets/naip/evidence/naip-analytic-2024-2025-sizes.json
    state_years: 52
    quads: 221255
    lrc_bytes: 180106491705482
    note: Sizes are the .lrc data files; the evidence file has the per-state figures. One Idaho 2025
      quad (m_4311118_ne_12_030_20250717) has a header and index but no data file and is left out.
build:
  converter: datasets/naip/worker/convert.py
  container: ghcr.io/osgeo/gdal:ubuntu-small-3.13.1 plus boto3
  settings: 'COG driver, bands 1 to 3, COMPRESS=JPEG, QUALITY=65, OVERVIEW_QUALITY=75, BLOCKSIZE=512,
    OVERVIEW_RESAMPLING=AVERAGE, OVERVIEWS=IGNORE_EXISTING'
  output_layout: <state>/<year>/<resolution>/rgb/<block>/<name>.tif
  overviews:
    builder: datasets/naip/overview.py (state files), datasets/naip/national.py (national file)
    settings: 'COG driver, COMPRESS=JPEG, QUALITY=75, OVERVIEW_QUALITY=75, BLOCKSIZE=512, with a mask;
      state files from the 9.6 m level of the quads, bilinear, in the quads'' UTM zone; national file
      in EPSG:3857 at 305.748 m (zoom 9 of 256 pixel tiles), averaged from the state files'
    output_layout: overviews/<state>-<year>-utm<zone>.tif, overviews/national-latest.tif
    index: stac/naip-overviews.parquet (117 items; linked from stac/naip.parquet with rel overviews)
